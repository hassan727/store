<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تفاصيل المنتج — VoltStore</title>
  <meta name="description" content="تفاصيل ومواصفات المنتج في VoltStore." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<div id="site-header"></div>

<main id="main-content">

  <div class="page-title-bar">
    <div class="container">
      <h1 id="product-page-title">تفاصيل المنتج</h1>
      <nav class="breadcrumb" id="product-breadcrumb" aria-label="مسار التنقل">
        <a href="index.html">الرئيسية</a>
        <span>/</span>
        <a href="products.html">المنتجات</a>
        <span>/</span>
        <span aria-current="page">المنتج</span>
      </nav>
    </div>
  </div>

  <div class="container">
    <div class="product-detail-layout">
      <div id="product-gallery" class="product-gallery">
        <div class="loading-spinner"><div class="spinner" role="status" aria-label="جاري التحميل..."></div></div>
      </div>
      <div id="product-info" class="product-detail-info"></div>
    </div>

    <!-- Related Products -->
    <section id="related-section" class="section-sm" aria-label="منتجات مشابهة">
      <div class="section-header">
        <h2>منتجات مشابهة</h2>
      </div>
      <div class="products-grid" id="related-products" role="list"></div>
    </section>
  </div>

</main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/product.js"></script>
</body>
</html>
